[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-tutor"
version = "0.1.0"
description = "Explain Linux terminal output and errors using a local LLM, with no external AI API required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Khalil Soltani" }]
keywords = ["linux", "ollama", "llm", "cli", "debugging", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Shells",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tutor = "terminal_tutor:main"
terminal-tutor = "terminal_tutor:main"

[tool.setuptools]
py-modules = ["terminal_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
